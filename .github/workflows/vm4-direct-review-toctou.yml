name: VM4 Direct Review TOCTOU
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review-hold:
    name: review-hold
    if: github.event.pull_request.title == 'VM4_WA_REVIEW_TOCTOU_20260912'
    runs-on: ubuntu-latest
    steps:
      - name: Hold merge finalization window
        run: sleep 45
      - name: Complete trusted check
        run: echo 'review-hold complete'
