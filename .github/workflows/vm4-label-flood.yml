name: VM4 Label Pagination Flood
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  flood-labels:
    if: github.event.pull_request.title == 'VM4_LABEL_PAGINATION_105_20260912'
    runs-on: ubuntu-latest
    steps:
      - name: Create and attach 105 controlled labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          export GH_TOKEN REPO PR api
          seq -w 1 105 | xargs -P 8 -I{} bash -c '
            name="vm4-label-{}"
            payload=$(jq -nc --arg name "$name" --arg description "VM4 controlled label pagination {}" "{name:\$name,color:\"ededed\",description:\$description}")
            code=$(curl -sS -o /tmp/label-{}.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/labels" --data-binary "$payload")
            test "$code" = 201 || test "$code" = 422
          '
          labels=$(seq -w 1 105 | jq -Rsc 'split("\n")[:-1] | map("vm4-label-" + .) | {labels:.}')
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/issues/${PR}/labels" --data-binary "$labels" >/dev/null
          p1=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/issues/${PR}/labels?per_page=100&page=1")
          p2=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/issues/${PR}/labels?per_page=100&page=2")
          echo "page1_count=$(jq 'length' <<<"$p1") page2_count=$(jq 'length' <<<"$p2") total=$(( $(jq 'length' <<<"$p1") + $(jq 'length' <<<"$p2") ))"
          echo "page1_first=$(jq -r '.[0].name' <<<"$p1") page1_last=$(jq -r '.[-1].name' <<<"$p1")"
          echo "page2_first=$(jq -r '.[0].name' <<<"$p2") page2_last=$(jq -r '.[-1].name' <<<"$p2")"
